<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>キラキラ！ぽいんとハウス</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (可愛いアイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=M+PLUS+Rounded+1C:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
    }
    body {
      font-family: 'M PLUS Rounded 1C', sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
    }
    .logo-font {
      font-family: 'Cherry Bomb One', cursive;
    }
    /* ぷっくり3Dボタン（人間工学に基づいたタップ感・コンパクトサイズ） */
    .btn-3d {
      position: relative;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      box-shadow: 0 4px 0 var(--shadow-color);
    }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--shadow-color);
    }
    /* もどすボタン用の小さな3D効果 */
    .btn-undo {
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      box-shadow: 0 3px 0 #cbd5e1;
    }
    .btn-undo:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }
    /* ふわふわ動く可愛いアニメーション */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .float-animation {
      animation: float 3.5s ease-in-out infinite;
    }
    /* タブ切り替えのフェードイン */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.15s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-700 h-dvh flex flex-col justify-between overflow-hidden select-none">

  <!-- パーティクル用キャンバス（画面全体にきれいに散るように最前面に配置） -->
  <canvas id="particleCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-50"></canvas>

  <!-- ヘッダー (極限までコンパクト化して表示スペースを広く確保) -->
  <header class="bg-white border-b-2 border-yellow-300 px-4 py-1.5 flex-shrink-0 shadow-sm">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <!-- 可愛いロゴ -->
      <div class="flex items-center space-x-1.5">
        <div class="bg-yellow-400 w-6 h-6 rounded-lg flex items-center justify-center text-white shadow-inner text-xs float-animation">
          <i class="fa-solid fa-star"></i>
        </div>
        <div>
          <h1 class="logo-font text-lg text-amber-500 tracking-wide leading-none">ぽいんとハウス</h1>
        </div>
      </div>

      <!-- 右側：設定 -->
      <div class="flex items-center space-x-1.5">
        <!-- 音切り替え -->
        <button id="soundToggleBtn" onclick="toggleSound()" class="w-7 h-7 rounded-full bg-slate-50 flex items-center justify-center border border-slate-200 text-slate-400 hover:bg-slate-100 transition-colors">
          <i id="soundIcon" class="fa-solid fa-volume-high text-xs"></i>
        </button>
        <!-- おうちコード確認用バッジ -->
        <div id="roomBadge" onclick="openRoomModal()" class="bg-slate-100 hover:bg-slate-200 cursor-pointer border border-slate-200 px-2 py-0.5 rounded-full flex items-center space-x-1 text-[10px]">
          <span class="font-bold text-slate-500">おうちID:</span>
          <span id="roomCodeDisplay" class="font-black text-slate-700 tracking-wider">------</span>
        </div>
      </div>
    </div>
  </header>

  <!-- メイン表示領域（デバイスの高さに合わせて完璧に伸縮） -->
  <main class="flex-grow max-w-md w-full mx-auto px-4 py-2 flex flex-col justify-between overflow-hidden">
    
    <!-- ================= 1. おうちコード入力画面（通常は自動スキップ） ================= -->
    <div id="roomSetupScreen" class="hidden bg-white border-4 border-yellow-300 rounded-3xl p-5 shadow-xl text-center my-auto flex flex-col space-y-4">
      <div class="text-5xl float-animation">🏡</div>
      <div>
        <h2 class="text-xl font-black text-amber-600">おうちコードをきめよう！</h2>
        <p class="text-[11px] text-slate-400 font-bold leading-relaxed mt-1">
          おなじコードをいれると、ほかの端末とポイントが同期されます。
        </p>
      </div>
      <div class="space-y-2">
        <input type="text" id="roomCodeInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="12345" placeholder="12345" 
               class="w-full text-center text-2xl font-black tracking-widest bg-amber-50 border-2 border-amber-200 focus:border-amber-400 focus:outline-none rounded-2xl py-2 text-amber-800">
      </div>
      <button onclick="joinRoom()" style="--shadow-color: #d97706" 
              class="btn-3d w-full bg-amber-500 hover:bg-amber-400 text-white font-black text-base py-3 rounded-2xl border-b-4 border-amber-700">
        スタートする！ ✨
      </button>
    </div>

    <!-- ================= 2. メイン画面（起動時に一瞬で表示されます） ================= -->
    <div id="mainAppScreen" class="hidden flex-grow flex flex-col justify-between space-y-2 overflow-hidden">
      
      <!-- メインポイント表示盤（ポイント数を圧倒的サイズに拡大！） -->
      <div class="bg-gradient-to-br from-amber-400 via-yellow-300 to-amber-300 border-2 border-white rounded-2xl p-3 shadow-md relative overflow-hidden flex-shrink-0">
        <div class="absolute -top-4 -left-4 text-white/25 text-5xl font-black pointer-events-none">⭐</div>
        <p class="text-white font-black text-[11px] text-center tracking-wider drop-shadow-sm leading-none">いま たまっている ぽいんと</p>
        
        <div class="flex items-center justify-between px-1 mt-1">
          <!-- 左側：圧倒的に大きなポイント表示 -->
          <div class="flex items-center space-x-1.5">
            <span class="text-white text-3xl drop-shadow-md animate-bounce-slow"><i class="fa-solid fa-crown text-amber-100"></i></span>
            <div class="flex items-baseline">
              <!-- テキストサイズをさらに大きく目立たせる（text-5xl→text-6xl md:text-7xl） -->
              <span id="totalPoints" class="text-6xl md:text-7xl font-black text-white tracking-tighter drop-shadow-[0_4px_0_rgba(217,119,6,1)]">0</span>
              <span class="text-amber-950 font-black text-sm ml-1"> P</span>
              <span class="text-amber-900/80 text-[10px] font-black ml-2 bg-white/50 px-2 py-0.5 rounded-lg border border-amber-200">1円</span>
            </div>
          </div>
          
          <!-- 右側：「1こもどす」ボタン -->
          <button onclick="undoLastAction(event)" class="btn-undo bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1.5 rounded-xl text-[11px] font-black flex items-center space-x-1 border border-slate-300">
            <i class="fa-solid fa-rotate-left"></i>
            <span>もどす</span>
          </button>
        </div>
      </div>

      <!-- 切り替えタブ -->
      <div class="flex bg-amber-100/60 p-1 rounded-xl border border-amber-200/60 flex-shrink-0">
        <button onclick="switchTab('earn')" id="tabBtn-earn" class="flex-1 py-1.5 text-center rounded-lg text-xs font-black transition-all text-amber-900 bg-white shadow-sm">
          <i class="fa-solid fa-circle-plus mr-1"></i> ためにいく
        </button>
        <button onclick="switchTab('spend')" id="tabBtn-spend" class="flex-1 py-1.5 text-center rounded-lg text-xs font-black transition-all text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-wallet mr-1"></i> つかう
        </button>
        <button onclick="switchTab('history')" id="tabBtn-history" class="flex-1 py-1.5 text-center rounded-lg text-xs font-black transition-all text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-clock-rotate-left mr-1"></i> きろく
        </button>
      </div>

      <!-- コンテンツエリア -->
      <div class="flex-grow overflow-hidden relative flex flex-col justify-center">
        
        <!-- 【ためるタブ】ボタンのサイズを人間工学に基きキュート＆コンパクト（h-28）に縮小！ -->
        <div id="tabContent-earn" class="tab-content active h-full justify-center">
          <div class="grid grid-cols-3 gap-3.5 w-full my-auto">
            
            <!-- タッチ (1P) -->
            <button onclick="addPoints(1, 'タッチしたよ！ 👈', event)" style="--shadow-color: #0d9488" 
                    class="btn-3d bg-emerald-400 hover:bg-emerald-300 text-white rounded-2xl p-2 flex flex-col items-center justify-between h-28 border-b-[4px] border-emerald-600">
              <span class="text-2xl mt-1">👈</span>
              <div class="text-center w-full mb-1">
                <span class="block font-black text-[11px] leading-none tracking-tighter text-emerald-50">タッチ</span>
                <span class="inline-block bg-emerald-600/30 px-2 py-0.5 rounded-full text-[9px] font-black mt-1 leading-none">+1 P</span>
              </div>
            </button>

            <!-- マッサージ (5P) -->
            <button onclick="addPoints(5, 'マッサージをしたよ 💆', event)" style="--shadow-color: #b45309" 
                    class="btn-3d bg-amber-500 hover:bg-amber-400 text-white rounded-2xl p-2 flex flex-col items-center justify-between h-28 border-b-[4px] border-amber-700">
              <span class="text-2xl mt-1">💆</span>
              <div class="text-center w-full mb-1">
                <span class="block font-black text-[11px] leading-none tracking-tighter text-amber-50">マッサージ</span>
                <span class="inline-block bg-amber-700/30 px-2 py-0.5 rounded-full text-[9px] font-black mt-1 leading-none">+5 P</span>
              </div>
            </button>

            <!-- お手伝い (10P) -->
            <button onclick="addPoints(10, 'おてつだいをしたよ 🧹', event)" style="--shadow-color: #db2777" 
                    class="btn-3d bg-pink-500 hover:bg-pink-400 text-white rounded-2xl p-2 flex flex-col items-center justify-between h-28 border-b-[4px] border-pink-700">
              <span class="text-2xl mt-1">🧹</span>
              <div class="text-center w-full mb-1">
                <span class="block font-black text-[11px] leading-none tracking-tighter text-pink-50">おてつだい</span>
                <span class="inline-block bg-pink-700/30 px-2 py-0.5 rounded-full text-[9px] font-black mt-1 leading-none">+10 P</span>
              </div>
            </button>
            
          </div>
        </div>

        <!-- 【つかうタブ】1円=1P その場入力フォーム -->
        <div id="tabContent-spend" class="tab-content h-full justify-center">
          <div class="bg-white border border-yellow-200 rounded-2xl p-3.5 shadow-inner w-full max-h-48 my-auto flex flex-col justify-between">
            <h3 class="text-[11px] font-black text-amber-700 text-center mb-1.5">🎁 たまったポイントをつかう（1円 ＝ 1P）</h3>
            
            <div class="space-y-1.5">
              <div class="flex space-x-2">
                <div class="w-1/3">
                  <label class="block text-[9px] font-bold text-slate-400 mb-0.5">いくら？</label>
                  <div class="relative">
                    <input type="number" id="spendAmount" min="1" placeholder="50" inputmode="numeric" pattern="[0-9]*"
                           class="w-full text-center text-sm font-black bg-amber-50 border border-amber-200 focus:border-amber-400 focus:outline-none rounded-xl py-1 text-amber-800 pr-5">
                    <span class="absolute right-2 top-1/2 transform -translate-y-1/2 text-[9px] font-bold text-amber-600">円</span>
                  </div>
                </div>
                <div class="w-2/3">
                  <label class="block text-[9px] font-bold text-slate-400 mb-0.5">なににつかう？</label>
                  <input type="text" id="spendReason" placeholder="例: おやつとこうかん"
                         class="w-full text-center text-xs font-bold bg-amber-50 border border-amber-200 focus:border-amber-400 focus:outline-none rounded-xl py-1 text-amber-800">
                </div>
              </div>

              <button onclick="submitSpend(event)" style="--shadow-color: #b45309"
                      class="btn-3d w-full bg-amber-500 hover:bg-amber-400 text-white rounded-xl font-black text-xs border-b-4 border-amber-700 py-1.5 mt-2">
                ポイントをつかう！ 🎁
              </button>
            </div>
          </div>
        </div>

        <!-- 【きろくタブ】スクロール可能な履歴リスト -->
        <div id="tabContent-history" class="tab-content h-full justify-start overflow-hidden">
          <div class="bg-white border border-yellow-200 rounded-2xl p-2.5 shadow-inner h-full overflow-y-auto max-h-48">
            <div id="historyList" class="space-y-1.5">
              <!-- 履歴 -->
              <div class="text-center py-6 text-slate-400 font-bold text-xs">
                まだきろくがありません。ポイントをためてみよう！
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- フッター -->
  <footer class="bg-slate-100 border-t border-slate-200 py-1 text-center flex-shrink-0">
    <p class="text-[8px] text-slate-400 font-bold">
      © キラキラ！ぽいんとハウス
    </p>
  </footer>

  <!-- ================= モーダル群 ================= -->

  <!-- おうちコード変更・確認 -->
  <div id="roomModal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-yellow-300 rounded-2xl p-4 max-w-xs w-full shadow-2xl relative">
      <button onclick="closeRoomModal()" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div class="text-center space-y-2.5">
        <div class="text-2xl">🏡</div>
        <h3 class="text-xs font-black text-slate-800">おうちコードのせってい</h3>
        <p class="text-[9px] text-slate-400 font-bold leading-relaxed">
          もしべつの端末ともポイントをあわせたい場合は、同じコードを入力してね。
        </p>
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-2">
          <span class="text-[9px] text-amber-500 font-black">いまのコード</span>
          <div id="currentRoomCodeInModal" class="text-xl font-black text-amber-800 tracking-wider">-----</div>
        </div>
        <div class="border-t border-slate-100 pt-2.5 space-y-1.5">
          <button onclick="logoutRoom()" class="w-full py-1.5 bg-red-50 text-red-500 hover:bg-red-100 rounded-xl font-black text-[10px] transition-colors">
            べつのコードにかえる
          </button>
          <button onclick="closeRoomModal()" class="w-full py-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl font-black text-[10px] transition-colors">
            とじる
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ポイント不足警告 -->
  <div id="warningModal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-red-200 rounded-2xl p-4 max-w-xs w-full shadow-2xl text-center space-y-2.5">
      <div class="text-3xl animate-bounce-slow">😭</div>
      <h3 class="text-xs font-black text-red-500">ぽいんとがたりないよ！</h3>
      <p class="text-[10px] text-slate-400 font-bold leading-relaxed">
        がんばっておてつだいやマッサージをして、ぽいんとをためてね！
      </p>
      <button onclick="closeWarningModal()" class="w-full py-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl font-black text-[10px] transition-colors">
        はーい！ 👍
      </button>
    </div>
  </div>

  <!-- ================= JavaScript (自動初期化 & 100%ローカル保存担保版) ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appState = {
      roomId: "",
      points: 0,
      logs: [],
      soundEnabled: true,
      firebaseActive: false,
      db: null,
      auth: null,
      appId: "kids-point-app",
      unsubscribeRoom: null
    };

    window.appState = appState;

    // Firebaseの起動をチェック
    const initFirebase = async () => {
      try {
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'kids-point-app';
        appState.appId = appId;

        if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
          const firebaseConfig = JSON.parse(window.__firebase_config);
          const app = initializeApp(firebaseConfig);
          const authInstance = getAuth(app);
          const dbInstance = getFirestore(app);

          appState.auth = authInstance;
          appState.db = dbInstance;

          if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
            await signInWithCustomToken(authInstance, window.__initial_auth_token);
          } else {
            await signInAnonymously(authInstance);
          }

          onAuthStateChanged(authInstance, (user) => {
            if (user) {
              appState.firebaseActive = true;
              autoLoginRoom();
            }
          });
        } else {
          autoLoginRoom();
        }
      } catch (error) {
        autoLoginRoom();
      }
    };

    // 自動でおうちコード「12345」を使ってログイン
    const autoLoginRoom = () => {
      const savedRoom = localStorage.getItem("point_house_room_id");
      // 保存されているおうちコードがなければ、デフォルトの「12345」を強制自動セット！
      const targetRoom = (savedRoom && savedRoom.length === 5) ? savedRoom : "12345";
      startRoomSync(targetRoom);
    };

    // クラウド & ローカル同期
    const startRoomSync = async (roomId) => {
      appState.roomId = roomId;
      localStorage.setItem("point_house_room_id", roomId);

      document.getElementById("roomCodeDisplay").innerText = roomId;
      document.getElementById("currentRoomCodeInModal").innerText = roomId;

      // 面倒な初期画面をスキップして、即アプリ起動！
      showScreen("mainAppScreen");

      if (appState.unsubscribeRoom) {
        appState.unsubscribeRoom();
      }

      if (appState.firebaseActive && appState.db) {
        const roomDocRef = doc(appState.db, 'artifacts', appState.appId, 'public', 'data', 'rooms', roomId);

        appState.unsubscribeRoom = onSnapshot(roomDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            updateLocalData(data.points || 0, data.logs || []);
          } else {
            saveDataToCloud(roomId, 0, []);
            updateLocalData(0, []);
          }
        }, (error) => {
          loadLocalBackup(roomId);
        });
      } else {
        loadLocalBackup(roomId);
      }
    };

    // セーブ
    const saveDataToCloud = async (roomId, points, logs) => {
      if (appState.firebaseActive && appState.db) {
        const roomDocRef = doc(appState.db, 'artifacts', appState.appId, 'public', 'data', 'rooms', roomId);
        try {
          await setDoc(roomDocRef, {
            points: points,
            logs: logs,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) {
          console.error("Cloud save error:", e);
        }
      }
      // 何があってもブラウザに強力保存！消えません
      localStorage.setItem(`room_data_${roomId}`, JSON.stringify({ points, logs }));
    };

    const loadLocalBackup = (roomId) => {
      const localData = localStorage.getItem(`room_data_${roomId}`);
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          updateLocalData(parsed.points || 0, parsed.logs || []);
        } catch (e) {
          updateLocalData(0, []);
        }
      } else {
        updateLocalData(0, []);
      }
    };

    const updateLocalData = (points, logs) => {
      appState.points = points;
      appState.logs = logs.sort((a, b) => b.timestamp - a.timestamp);
      document.getElementById("totalPoints").innerText = points;
      renderHistory();
    };

    window.startRoomSync = startRoomSync;
    window.saveDataToCloud = saveDataToCloud;
    window.updateLocalData = updateLocalData;

    window.addEventListener("load", () => {
      initFirebase();
      initParticles();
    });
  </script>

  <!-- 通常のUI制御スクリプト -->
  <script>
    function showScreen(screenId) {
      document.getElementById("roomSetupScreen").classList.add("hidden");
      document.getElementById("mainAppScreen").classList.add("hidden");
      document.getElementById(screenId).classList.remove("hidden");
    }

    function joinRoom() {
      const input = document.getElementById("roomCodeInput").value.trim();
      if (input.length !== 5 || isNaN(input)) {
        playSynthError();
        alertInApp("5桁の数字を入力してね！");
        return;
      }
      playSynthSuccess();
      window.startRoomSync(input);
    }

    function alertInApp(msg) {
      const toast = document.createElement("div");
      toast.className = "fixed bottom-12 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-[11px] font-black shadow-lg z-50 animate-bounce";
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 1500);
    }

    function logoutRoom() {
      localStorage.removeItem("point_house_room_id");
      window.appState.roomId = "";
      document.getElementById("roomCodeInput").value = "12345";
      closeRoomModal();
      showScreen("roomSetupScreen");
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll("[id^='tabBtn-']").forEach(el => {
        el.classList.remove("bg-white", "shadow-sm", "text-amber-900");
        el.classList.add("text-slate-500", "hover:text-slate-800");
      });

      document.getElementById(`tabContent-${tabName}`).classList.add("active");
      const activeBtn = document.getElementById(`tabBtn-${tabName}`);
      activeBtn.classList.remove("text-slate-500", "hover:text-slate-800");
      activeBtn.classList.add("bg-white", "shadow-sm", "text-amber-900");

      playSynthSwitch();
    }

    // ポイントをためる
    function addPoints(amount, label, event) {
      const currentPoints = window.appState.points;
      const newPoints = currentPoints + amount;
      
      const newLog = {
        id: crypto.randomUUID(),
        text: label,
        points: amount,
        timestamp: Date.now(),
        type: "add"
      };

      const updatedLogs = [...window.appState.logs, newLog];
      window.saveDataToCloud(window.appState.roomId, newPoints, updatedLogs);
      window.updateLocalData(newPoints, updatedLogs);

      if (event && event.clientX) {
        spawnParticles(event.clientX, event.clientY);
      } else {
        spawnParticles(window.innerWidth / 2, window.innerHeight / 2);
      }
      playAddSound(amount);
    }

    // 1こ戻す (Undo)
    function undoLastAction(event) {
      if (!window.appState.logs || window.appState.logs.length === 0) {
        playSynthError();
        alertInApp("もどすきろくがありません！");
        return;
      }

      const sortedLogs = [...window.appState.logs].sort((a, b) => b.timestamp - a.timestamp);
      const lastAction = sortedLogs[0];
      
      const updatedLogs = window.appState.logs.filter(log => log.id !== lastAction.id);
      const newPoints = Math.max(0, window.appState.points - lastAction.points);

      window.saveDataToCloud(window.appState.roomId, newPoints, updatedLogs);
      window.updateLocalData(newPoints, updatedLogs);

      if (event && event.clientX) {
        spawnUndoParticles(event.clientX, event.clientY);
      } else {
        spawnUndoParticles(window.innerWidth / 2, window.innerHeight / 2);
      }
      playSynthUndo();
      alertInApp("1つ前の操作をもどしたよ！");
    }

    // つかう（1円＝1P）
    function submitSpend(event) {
      const amount = parseInt(document.getElementById("spendAmount").value);
      let reason = document.getElementById("spendReason").value.trim();

      if (!amount || amount <= 0) {
        playSynthError();
        alertInApp("えん（ポイント）をいれてね！");
        return;
      }

      if (window.appState.points < amount) {
        playSynthError();
        document.getElementById("warningModal").classList.remove("hidden");
        return;
      }

      if (!reason) {
        reason = "おかいもの・ごほうび 🎁";
      }

      const currentPoints = window.appState.points;
      const newPoints = currentPoints - amount;
      const newLog = {
        id: crypto.randomUUID(),
        text: `🎁 ${reason} に ${amount}円つかった`,
        points: -amount,
        timestamp: Date.now(),
        type: "spend"
      };

      const updatedLogs = [...window.appState.logs, newLog];
      window.saveDataToCloud(window.appState.roomId, newPoints, updatedLogs);
      window.updateLocalData(newPoints, updatedLogs);

      document.getElementById("spendAmount").value = "";
      document.getElementById("spendReason").value = "";

      if (event && event.clientX) {
        spawnSpendParticles(event.clientX, event.clientY);
      } else {
        spawnSpendParticles(window.innerWidth / 2, window.innerHeight / 2);
      }
      playSynthSpend();
      alertInApp(`${amount} 円分つかったよ！`);
    }

    function closeWarningModal() {
      document.getElementById("warningModal").classList.add("hidden");
    }

    function renderHistory() {
      const listEl = document.getElementById("historyList");
      listEl.innerHTML = "";

      if (!window.appState.logs || window.appState.logs.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-6 text-slate-400 font-bold text-xs">
            まだきろくがありません。ポイントをためてみよう！
          </div>
        `;
        return;
      }

      window.appState.logs.forEach(log => {
        const date = new Date(log.timestamp);
        const timeStr = `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        
        const isAdd = log.points > 0;
        const icon = isAdd ? "➕" : "🎁";
        const badgeColor = isAdd ? "bg-emerald-100 text-emerald-800 border-emerald-200" : "bg-rose-100 text-rose-800 border-rose-200";
        const pointText = isAdd ? `+${log.points} P` : `${log.points} P`;

        const logItem = document.createElement("div");
        logItem.className = `flex items-center justify-between p-2 border rounded-xl bg-slate-50 border-slate-100`;
        logItem.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-base">${icon}</span>
            <div class="text-left">
              <p class="font-black text-[10px] text-slate-700 leading-tight">${log.text}</p>
              <p class="text-[8px] text-slate-400 font-bold leading-none mt-0.5">${timeStr}</p>
            </div>
          </div>
          <span class="px-2 py-0.5 border rounded-full font-black text-[9px] ${badgeColor}">
            ${pointText}
          </span>
        `;
        listEl.appendChild(logItem);
      });
    }

    function openRoomModal() {
      document.getElementById("roomModal").classList.remove("hidden");
      playSynthSwitch();
    }
    function closeRoomModal() {
      document.getElementById("roomModal").classList.add("hidden");
    }

    function toggleSound() {
      window.appState.soundEnabled = !window.appState.soundEnabled;
      const icon = document.getElementById("soundIcon");
      if (window.appState.soundEnabled) {
        icon.className = "fa-solid fa-volume-high text-amber-500";
        playSynthSuccess();
      } else {
        icon.className = "fa-solid fa-volume-xmark text-slate-400";
      }
    }

    // ================= 音声エンジン =================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playAddSound(amount) {
      if (!window.appState.soundEnabled) return;
      try {
        if (amount === 1) playSynth1P();
        else if (amount === 5) playSynth5P();
        else if (amount === 10) playSynth10P();
      } catch (e) {}
    }

    function playSynth1P() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(650, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1300, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    }

    function playSynth5P() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const playTone = (freq, start, duration) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.12, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      };
      playTone(550, now, 0.08);
      playTone(700, now + 0.08, 0.12);
    }

    function playSynth10P() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const playTone = (freq, start, duration) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.1, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      };
      playTone(523, now, 0.08);
      playTone(659, now + 0.06, 0.08);
      playTone(783, now + 0.12, 0.08);
      playTone(1046, now + 0.18, 0.25);
    }

    function playSynthSpend() {
      if (!window.appState.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    function playSynthUndo() {
      if (!window.appState.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    function playSynthSwitch() {
      if (!window.appState.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.06);
      } catch (e) {}
    }

    function playSynthError() {
      if (!window.appState.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } catch (e) {}
    }

    function playSynthSuccess() {
      if (!window.appState.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    // ================= パーティクル =================
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function initParticles() {
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      requestAnimationFrame(particleLoop);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor(x, y, mode = 'add') {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 10 + 5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1.2;
        this.alpha = 1;
        this.decay = Math.random() * 0.025 + 0.02;
        this.gravity = 0.1;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 4 - 2;
        
        if (mode === 'add') {
          this.color = ['#FFC0CB', '#FFD700', '#00FA9A', '#00BFFF', '#FF69B4', '#FF8C00'][Math.floor(Math.random() * 6)];
          this.shape = Math.random() > 0.4 ? 'star' : 'circle';
        } else if (mode === 'undo') {
          this.color = '#94a3b8';
          this.shape = 'star';
        } else {
          this.color = ['#FF4500', '#FF1493', '#DA70D6', '#FF6347'][Math.floor(Math.random() * 4)];
          this.shape = 'circle';
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= this.decay;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        if (this.shape === 'star') {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos(((18 + i * 72) * Math.PI) / 180) * this.size,
                       -Math.sin(((18 + i * 72) * Math.PI) / 180) * this.size);
            ctx.lineTo(Math.cos(((54 + i * 72) * Math.PI) / 180) * (this.size / 2.5),
                       -Math.sin(((54 + i * 72) * Math.PI) / 180) * (this.size / 2.5));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function spawnParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        particles.push(new Particle(x, y, 'add'));
      }
    }

    function spawnSpendParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        particles.push(new Particle(x, y, 'spend'));
      }
    }

    function spawnUndoParticles(x, y) {
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(x, y, 'undo'));
      }
    }

    function particleLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(particleLoop);
    }
  </script>
</body>
